---
- name: Get list of installed packages
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Package
    api_version: "1"
    api_method: list
    request_method: POST
    ignore_api_errors: [119]
  register: _synology_installed_packages

- name: Set installed package names fact
  ansible.builtin.set_fact:
    _synology_installed_pkg_names: "{{ (_synology_installed_packages.json.data.packages | default([])) | map(attribute='id') | list }}"
  when: _synology_installed_packages.json.success | default(false)

- name: Set installed package names fact (empty fallback)
  ansible.builtin.set_fact:
    _synology_installed_pkg_names: []
  when: not (_synology_installed_packages.json.success | default(false))

- name: Auto-detect latest available Python package from DSM
  when: synology_bootstrap_python_package == 'auto'
  block:
    - name: Query available packages from DSM package server
      synology_dsm_api_request:
        base_url: "{{ synology_bootstrap_dsm_url }}"
        validate_certs: "{{ synology_bootstrap_validate_certs }}"
        login_sid: "{{ synology_bootstrap_sid }}"
        api_name: SYNO.Core.Package.Server
        api_version: "2"
        api_method: list
        request_method: POST
        ignore_api_errors: [119]
      register: _synology_available_packages

    - name: Set auto-detected Python package fact
      ansible.builtin.set_fact:
        _synology_python_package: >-
          {{
            (_synology_available_packages.json.data.packages | default([]))
            | map(attribute='id')
            | select('match', '^python3[0-9]+$')
            | sort
            | last
            | default('python314')
          }}

    - name: Debug — auto-detected Python package
      ansible.builtin.debug:
        msg: "Auto-detected Python package: {{ _synology_python_package }}"

- name: Set Python package fact (explicit)
  ansible.builtin.set_fact:
    _synology_python_package: "{{ synology_bootstrap_python_package }}"
  when: synology_bootstrap_python_package != 'auto'

- name: Build resolved package list
  ansible.builtin.set_fact:
    _synology_resolved_package_list: >-
      {{
        synology_bootstrap_package_list
        | map('regex_replace', '^__python__$', _synology_python_package)
        | list
      }}

# NOTE: type 0 = official Synology packages, type 1 = community/3rd-party packages.
# Community packages (e.g. python314 from SynoCommunity) will return error 103 with type 0.
# Use synology_bootstrap_community_packages list for packages that need type 1.
- name: Install official packages via DSM API (type 0)
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Package.Installation
    api_version: "2"
    api_method: install
    request_method: POST
    api_params:
      id: "{{ item }}"
      type: "0"
    ignore_api_errors: [119, 103]
  loop: "{{ _synology_resolved_package_list | difference(synology_bootstrap_community_packages) }}"
  loop_control:
    label: "{{ item }}"
  when: item not in _synology_installed_pkg_names
  register: _pkg_install_results

- name: Install community packages via DSM API (type 1 — requires SynoCommunity feed)
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Package.Installation
    api_version: "2"
    api_method: install
    request_method: POST
    api_params:
      id: "{{ item }}"
      type: "1"
    ignore_api_errors: [119, 103]
  loop: "{{ _synology_resolved_package_list | select('in', synology_bootstrap_community_packages) | list }}"
  loop_control:
    label: "{{ item }}"
  when: item not in _synology_installed_pkg_names
  register: _pkg_community_install_results

- name: Debug — package install skipped (insufficient permissions)
  ansible.builtin.debug:
    msg: "SKIPPED (insufficient permissions): package install requires DSM primary admin account"
  when: _synology_installed_packages.ignored_api_error is defined and _synology_installed_packages.ignored_api_error == 119
