---
# Notification configuration is intentionally minimal by default.
# Extend by setting synology_bootstrap_notify_mail_* variables.

- name: Get current notification settings
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Notification.Mail.Conf
    api_version: "1"
    api_method: get
    ignore_api_errors: [119]
  register: _synology_notify_conf
  ignore_errors: true

- name: Debug — Get current notification settings
  ansible.builtin.debug:
    msg: "SKIPPED (insufficient permissions — needs DSM admin account): Get current notification settings"
  when: _synology_notify_conf.ignored_api_error is defined and _synology_notify_conf.ignored_api_error == 119

- name: Display current notification config
  ansible.builtin.debug:
    var: _synology_notify_conf.json.data

- name: Note — tasks requiring DSM admin account
  ansible.builtin.debug:
    msg: >
      Some tasks in this file require the built-in DSM admin account (SYNO.Core.* write APIs).
      If you see 'ignored_api_error: 119', enable the admin account temporarily or run bootstrap
      as admin. Affected APIs: SYNO.Core.Package.Feed, SYNO.Core.FileServ.*, SYNO.Core.Share,
      SYNO.Core.Region.NTP, SYNO.Core.Security.*, SYNO.Core.Terminal, SYNO.Core.User.Home
  when: false  # informational only — never actually runs
