---
- name: Get existing shares
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Share
    api_version: "1"
    api_method: list
    request_method: POST
    ignore_api_errors: [119]
  register: _synology_existing_shares

- name: Debug — Get existing shares
  ansible.builtin.debug:
    msg: "SKIPPED (insufficient permissions — needs DSM admin account): Get existing shares"
  when: _synology_existing_shares.ignored_api_error is defined and _synology_existing_shares.ignored_api_error == 119

- name: Set existing share names fact
  ansible.builtin.set_fact:
    _synology_share_names: "{{ _synology_existing_shares.json.data.shares | map(attribute='name') | list }}"

- name: Create shared folders
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Share
    api_version: "1"
    api_method: create
    request_method: POST
    api_params:
      name: "{{ item.name }}"
      vol_path: "{{ item.volume | default('/volume1') }}"
      desc: "{{ item.desc | default('') }}"
    ignore_api_errors: [103, 119]
  loop: "{{ synology_bootstrap_shares }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in _synology_share_names
  register: _create_shared_folders

- name: Debug — Create shared folders
  ansible.builtin.debug:
    msg: "SKIPPED (insufficient permissions — needs DSM admin account): Create shared folders"
  when: _create_shared_folders.ignored_api_error is defined and _create_shared_folders.ignored_api_error == 119

- name: Note — tasks requiring DSM admin account
  ansible.builtin.debug:
    msg: >
      Some tasks in this file require the built-in DSM admin account (SYNO.Core.* write APIs).
      If you see 'ignored_api_error: 119', enable the admin account temporarily or run bootstrap
      as admin. Affected APIs: SYNO.Core.Package.Feed, SYNO.Core.FileServ.*, SYNO.Core.Share,
      SYNO.Core.Region.NTP, SYNO.Core.Security.*, SYNO.Core.Terminal, SYNO.Core.User.Home
  when: false  # informational only — never actually runs
