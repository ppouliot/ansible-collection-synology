---
- name: Get current group membership
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.User
    api_version: "1"
    api_method: list
    request_method: POST
    ignore_api_errors: [119]
  register: _synology_all_users
  when: synology_bootstrap_group_members | length > 0

- name: Add members to groups
  synology_dsm_api_request:
    base_url: "{{ synology_bootstrap_dsm_url }}"
    validate_certs: "{{ synology_bootstrap_validate_certs }}"
    login_sid: "{{ synology_bootstrap_sid }}"
    api_name: SYNO.Core.Group
    api_version: "1"
    api_method: set
    request_method: POST
    api_params:
      name: "{{ item.group }}"
      members: "{{ item.members | to_json | to_json }}"
    ignore_api_errors: [103, 119]
  loop: "{{ synology_bootstrap_group_members }}"
  loop_control:
    label: "{{ item.members | join(', ') }} → {{ item.group }}"
