---
# =============================================================================
# synology_bootstrap role test
# Tests DSM API reachability, auth, system info, and SSH enable
# Usage: ansible-playbook -i <inventory> roles/synology_bootstrap/tests/test.yml
# =============================================================================
- name: Test synology_bootstrap role — DSM API phase
  hosts: synology
  connection: local
  gather_facts: false
  tasks:
    - name: Login to DSM API
      synology_dsm_api_request:
        base_url: "{{ synology_bootstrap_dsm_url }}"
        validate_certs: "{{ synology_bootstrap_validate_certs }}"
        api_name: SYNO.API.Auth
        api_version: "3"
        api_method: login
        request_method: POST
        api_params:
          account: "{{ synology_bootstrap_username }}"
          passwd: "{{ synology_bootstrap_password }}"
          session: ansible_test
          format: sid
      register: _test_login

    - name: Assert login succeeded
      ansible.builtin.assert:
        that:
          - _test_login.json.success == true
          - _test_login.json.data.sid is defined
        fail_msg: "DSM API login failed for {{ inventory_hostname }} ({{ synology_bootstrap_dsm_url }})"
        success_msg: "DSM API login OK — {{ inventory_hostname }}"

    - name: Get DSM system info
      synology_dsm_api_request:
        base_url: "{{ synology_bootstrap_dsm_url }}"
        validate_certs: "{{ synology_bootstrap_validate_certs }}"
        login_cookie: "{{ _test_login.json.data.sid }}"
        api_name: SYNO.DSM.Info
        api_version: "2"
        api_method: getinfo
      register: _test_dsm_info

    - name: Assert DSM info returned model and version
      ansible.builtin.assert:
        that:
          - _test_dsm_info.json.success == true
          - _test_dsm_info.json.data.model is defined
          - _test_dsm_info.json.data.version is defined
        fail_msg: "DSM info query failed or missing fields for {{ inventory_hostname }}"
        success_msg: "DSM info OK — {{ _test_dsm_info.json.data.model }} DSM {{ _test_dsm_info.json.data.version }}"

    - name: Test SSH enable via API
      synology_dsm_api_request:
        base_url: "{{ synology_bootstrap_dsm_url }}"
        validate_certs: "{{ synology_bootstrap_validate_certs }}"
        login_cookie: "{{ _test_login.json.data.sid }}"
        api_name: SYNO.Core.Terminal
        api_version: "3"
        api_method: set
        request_method: POST
        api_params:
          enable_ssh: "true"
          ssh_port: "{{ synology_bootstrap_ssh_port }}"
      register: _test_ssh_enable
      ignore_errors: true

    - name: Assert SSH enable accepted
      ansible.builtin.assert:
        that:
          - _test_ssh_enable.json.success == true
        fail_msg: "SSH enable API call failed for {{ inventory_hostname }}"
        success_msg: "SSH enable API OK — {{ inventory_hostname }}"

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ synology_bootstrap_ssh_port }}"
        timeout: 60
        delay: 5
        connect_timeout: 10
        state: started
      register: _test_ssh_wait

    - name: Assert SSH port is reachable
      ansible.builtin.assert:
        that:
          - _test_ssh_wait is not failed
        fail_msg: "SSH port {{ synology_bootstrap_ssh_port }} not reachable on {{ inventory_hostname }} ({{ ansible_host }})"
        success_msg: "SSH port open — {{ inventory_hostname }}:{{ synology_bootstrap_ssh_port }}"

    - name: Logout from DSM API
      synology_dsm_api_request:
        base_url: "{{ synology_bootstrap_dsm_url }}"
        validate_certs: "{{ synology_bootstrap_validate_certs }}"
        login_cookie: "{{ _test_login.json.data.sid }}"
        api_name: SYNO.API.Auth
        api_version: "1"
        api_method: logout
        api_params:
          session: ansible_test
      ignore_errors: true
