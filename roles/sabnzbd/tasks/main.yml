- name: Ensure sabnzbd started
  block:
    - name: Restart sabnzbd
      community.docker.docker_container:
        docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
        name: sabnzbd
        image: "{{ sabnzbd_container_image }}"
        networks:
          - name: synology-docker-network
        pull: true
        network_mode: container:gluetun
        volumes:
          - "{{ container_directory_root }}/sabnzbd:/config"
          - "{{ container_directory_root }}/downloads:/downloads"
        env:
          PUID: "{{ user_puid }}"
          PGID: "{{ group_pgid }}"
          TZ: "{{ default_timezone }}"
          UMASK: "022"
        state: started
        restart: true
        restart_policy: unless-stopped
      register: _sabnzbd_status
    - name: set sabnzbd_is_running fact
      ansible.builtin.set_fact:
        sabnzbd_is_running: "{{ _sabnzbd_status.container.State.Running }}"
#    - name: "wait for sabnzbd to come up and test with new password"
#      ansible.builtin.uri:
#        url: "http://sabnzbd:{{ sabnzbd_control_password }}@{{ ansible_default_ipv4.address }}:{{ sabnzbd_port }}"
#        method: GET
#        status_code: 200
#      register: _result
#      until: _result.status == 200
#      retries: 30  # retry X times
#      delay: 60  # pause for X sec b/w each call
  when: _sabnzbd_state.exists
  tags:
    - sabnzbd
  # end block
- name: "nbget: print facts"
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop:
    - "sabnzbd_port: {{ sabnzbd_port }}"
    - "sabnzbd_config_dir: {{ sabnzbd_config_dir }}"
    - "sabnzbd_download_dir: {{ sabnzbd_download_dir }}"
    - "sabnzbd_incomplete_download_dir: {{ sabnzbd_incomplete_download_dir }}"
    - "sabnzbd_state: {{ sabnzbd_state }}"
    - "sabnzbd_is_running: {{ sabnzbd_is_running }}"
  tags:
    - sabnzbd
