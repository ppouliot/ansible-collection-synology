---
# =============================================================================
# synology_swarm/tasks/main.yml
#
# Manages Docker Swarm cluster formation and stack deployment on Synology DSM.
#
# Prerequisites (handled by dsm_configuration + dsm_container_manager):
#   - Docker/ContainerManager installed and running
#   - Docker API exposed on TCP 2375
#   - Python docker libs installed via /bin/pip
#   - community.docker modules connect via TCP — no NAS Python needed
#
# Swarm topology is driven by inventory:
#   [swarm]         group containing all nodes
#   swarm_role=manager   on the primary manager host
#   swarm_role=worker    on any worker nodes
# =============================================================================

- name: "Swarm: Skip role if docker is not enabled"
  ansible.builtin.meta: end_host
  when: not synology_docker_enable | default(false)

- name: "Swarm: Check local node swarm state"
  ansible.builtin.command: >
    {{ synology_docker_cli }} info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
  register: _swarm_status
  changed_when: false

- name: "Swarm: Identify primary manager"
  ansible.builtin.set_fact:
    primary_manager: >-
      {{
        groups['synology']
        | map('extract', hostvars)
        | selectattr('swarm_role', 'defined')
        | selectattr('swarm_role', 'equalto', 'manager')
        | map(attribute='inventory_hostname')
        | list | first
      }}
  delegate_to: localhost
  run_once: true

# ── Manager init ──────────────────────────────────────────────────────────────

- name: "Swarm: Initialize primary manager"
  ansible.builtin.include_tasks: manager_init.yml
  when: inventory_hostname == primary_manager

# ── Secondary managers ────────────────────────────────────────────────────────

- name: "Swarm: Join secondary managers"
  ansible.builtin.include_tasks: manager_join.yml
  when:
    - swarm_role | default('') == 'manager'
    - inventory_hostname != primary_manager

# ── Workers ───────────────────────────────────────────────────────────────────

- name: "Swarm: Join worker nodes"
  ansible.builtin.include_tasks: worker_join.yml
  when: swarm_role | default('') == 'worker'

# ── Stack deployment + facts (manager only) ───────────────────────────────────

- name: "Swarm: Deploy stacks and gather facts"
  ansible.builtin.include_tasks: deploy_stacks.yml
  when: inventory_hostname == primary_manager
