---
# =============================================================================
# pip.yml — Bootstrap pip and install base Python packages
#
# Uses synology_pip_executable (set by facts/python.yml) which matches
# synology_python_best (python3.14 > python3.12 > /bin/python3).
# Single interpreter strategy: everything goes into the highest available
# Python. docker>=7.0.0 is compatible with python3.14.
#
# Falls back to /bin/pip if python facts haven't run yet.
# =============================================================================

- name: "pip: Set pip executable from python facts (fallback: /bin/pip)"
  ansible.builtin.set_fact:
    _pip_exec: "{{ synology_pip_executable | default('/bin/pip') }}"

- name: "pip: Check if pip is available at selected executable"
  ansible.builtin.command:
    cmd: "{{ _pip_exec }} --version"
  register: _pip_check
  ignore_errors: true
  changed_when: false

- name: "pip: Bootstrap pip via get-pip.py if not found"
  block:
    - name: "pip: Retrieve get-pip.py"
      ansible.builtin.get_url:
        url: https://bootstrap.pypa.io/get-pip.py
        dest: /volume1/get-pip.py
        mode: '0770'

    - name: "pip: Bootstrap pip using best interpreter ({{ synology_python_best | default('/bin/python3') }})"
      ansible.builtin.command:
        cmd: "{{ synology_python_best | default('/bin/python3') }} /volume1/get-pip.py"
      register: _bootstrap_pip
      changed_when: _bootstrap_pip.rc == 0

    - name: "pip: Clean up get-pip.py"
      ansible.builtin.file:
        path: /volume1/get-pip.py
        state: absent
  when: _pip_check.rc != 0

- name: "pip: Remove stale /usr/local/bin/pip symlink if present"
  ansible.builtin.file:
    path: /usr/local/bin/pip
    state: absent

- name: "pip: Upgrade pip to latest"
  ansible.builtin.pip:
    name: pip
    executable: "{{ _pip_exec }}"
    state: latest
    extra_args: "-U"

- name: "pip: Install/upgrade base packages (setuptools, jsondiff)"
  ansible.builtin.pip:
    name:
      - setuptools
      - jsondiff
    executable: "{{ _pip_exec }}"
    state: present
