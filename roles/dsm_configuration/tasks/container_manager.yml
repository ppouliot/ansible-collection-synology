---
# =============================================================================
# dsm_configuration/tasks/container_manager.yml
#
# Delegates to the standalone dsm_container_manager role.
# This file is included from dsm_configuration/tasks/main.yml — callers of
# dsm_configuration do not need to change anything.
#
# Variables are inherited from the calling play's scope (synology_docker_enable,
# synology_docker_api_access_enable, synology_ghcr_*, etc.).
# =============================================================================

- name: "ContainerManager: Delegate to interoperable.synology.dsm_container_manager"
  ansible.builtin.include_role:
    name: interoperable.synology.dsm_container_manager
