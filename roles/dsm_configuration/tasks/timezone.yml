---
# Set DSM timezone by writing directly to /etc/synoinfo.conf.
#
# SYNO.Core.Region.NTP set requires the built-in admin account via HTTP API (error 119).
# synowebapi returns rc=0 but silently does nothing when called via sudo pipe.
# Direct synoinfo.conf edit is the reliable approach for SSH-based automation.
#
# DSM reads timezone on service restart — the change takes effect immediately
# for display purposes; a reboot is not required.
#
# Valid DSM timezone keys match the Synology UI dropdown labels, e.g.:
#   "Eastern"      → (GMT-05:00) Eastern Time (US & Canada)
#   "Bogota"       → (GMT-05:00) Bogota, Lima, Quito, Rio Branco
#   "Pacific"      → (GMT-08:00) Pacific Time (US & Canada)
#   "UTC"          → (GMT+00:00) UTC
#
# Keys are found in /usr/syno/synoman/webman/texts/enu/strings on the NAS.

- name: Get current DSM timezone
  become: true
  ansible.builtin.command:
    cmd: grep '^timezone=' /etc/synoinfo.conf
  register: _current_timezone
  changed_when: false
  failed_when: false

- name: Set DSM timezone in /etc/synoinfo.conf
  become: true
  ansible.builtin.replace:
    path: /etc/synoinfo.conf
    regexp: '^timezone=".*"'
    replace: 'timezone="{{ synology_dsm_timezone }}"'
  register: _set_timezone
  when: >
    synology_dsm_timezone | length > 0 and
    ('timezone="' + synology_dsm_timezone + '"') not in _current_timezone.stdout | default('')

- name: Display timezone result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: timezone
      {{ _current_timezone.stdout | default('unknown') }}
      {% if _set_timezone is changed %}→ {{ synology_dsm_timezone }} ✓{% else %}(already correct){% endif %}
