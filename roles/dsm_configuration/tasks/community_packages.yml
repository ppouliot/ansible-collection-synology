---
# Install SynoCommunity packages via synopkg install <local.spk>
#
# DSM HTTP API returns error 103 for community packages (install_from_server blocked).
# The correct method: the NAS fetches the SPK catalog JSON itself, downloads the .spk
# directly, and installs it — no traffic routed through the controller at all.
# This avoids saturating the WAN link to the remote site.
#
# Packages are installed in the order declared in synology_dsm_community_packages
# so that dependencies (e.g. python312, synocli-net) are satisfied before dependents (byobu).

- name: Get installed packages list
  become: true
  ansible.builtin.command:
    cmd: /usr/syno/bin/synopkg list --name
  register: _installed_pkgs
  changed_when: false

- name: Set installed packages fact
  ansible.builtin.set_fact:
    _installed_pkg_names: "{{ _installed_pkgs.stdout_lines | map('trim') | list }}"

- name: Ensure SPK temp directory exists on NAS
  become: true
  ansible.builtin.file:
    path: "{{ synology_dsm_spk_tmp }}"
    state: directory
    mode: '0755'

- name: Fetch community package SPK URLs from SynoCommunity (runs on NAS)
  ansible.builtin.uri:
    url: "https://packages.synocommunity.com/?language=enu&arch={{ synology_dsm_arch }}&build={{ synology_dsm_build }}&major=7&micro=2&minor=3&nano=0&package_update_channel=stable"
    return_content: true
  register: _synocommunity_catalog

- name: Build package → URL map from catalog
  ansible.builtin.set_fact:
    _spk_ordered: >-
      {{
        _synocommunity_catalog.json.packages
        | selectattr('package', 'in', synology_dsm_community_packages)
        | items2dict(key_name='package', value_name='link')
      }}

- name: Download SPK directly on NAS in declared order
  become: true
  ansible.builtin.get_url:
    url: "{{ _spk_ordered[item] }}"
    dest: "{{ synology_dsm_spk_tmp }}/{{ item }}.spk"
    mode: '0644'
    force: false
  loop: "{{ synology_dsm_community_packages }}"
  when:
    - item not in _installed_pkg_names
    - item in _spk_ordered

- name: Install SPK packages in declared order (dependencies first)
  become: true
  ansible.builtin.command:
    cmd: "/usr/syno/bin/synopkg install {{ synology_dsm_spk_tmp }}/{{ item }}.spk"
  loop: "{{ synology_dsm_community_packages }}"
  when:
    - item not in _installed_pkg_names
    - item in _spk_ordered
  register: _synopkg_install
  changed_when: _synopkg_install.rc == 0

- name: Verify installed packages
  become: true
  ansible.builtin.command:
    cmd: /usr/syno/bin/synopkg list --name
  register: _post_install_pkgs
  changed_when: false

- name: Report install results
  ansible.builtin.debug:
    msg: >-
      {{ item }}:
      {% if item in _post_install_pkgs.stdout %}✅ installed{% else %}❌ NOT found{% endif %}
  loop: "{{ synology_dsm_community_packages }}"

- name: Clean up SPK files from NAS
  become: true
  ansible.builtin.file:
    path: "{{ synology_dsm_spk_tmp }}/{{ item }}.spk"
    state: absent
  loop: "{{ synology_dsm_community_packages }}"
  when: item in _spk_ordered
