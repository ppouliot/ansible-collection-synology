---
# Install SynoCommunity packages via synopkg install <local.spk>
#
# DSM HTTP API returns error 103 for community packages (install_from_server blocked).
# Flow:
#   1. Controller fetches SPK catalog JSON (NAS may have no outbound internet)
#   2. Controller downloads .spk files to /tmp/syno_spk/ locally
#   3. .spk files are copied to NAS via SSH (ansible copy)
#   4. synopkg install runs on NAS from local path
#
# Packages are installed in declared order — python312 must be first and
# running before byobu installs (DSM error 268 if dep not running).

- name: Get installed packages list
  become: true
  ansible.builtin.command:
    cmd: /usr/syno/bin/synopkg list --name
  register: _installed_pkgs
  changed_when: false

- name: Set installed packages fact
  ansible.builtin.set_fact:
    _installed_pkg_names: "{{ _installed_pkgs.stdout_lines | map('trim') | list }}"
    cacheable: true

- name: Ensure SPK temp directory exists on NAS
  become: true
  ansible.builtin.file:
    path: "{{ synology_dsm_spk_tmp }}"
    state: directory
    mode: '0755'

# Catalog fetch runs on the CONTROLLER (delegate_to: localhost) because NAS
# nodes (ds218, ds418, and any site behind NAT) may have no outbound internet.
- name: Fetch community package SPK URLs from SynoCommunity (runs on controller)
  ansible.builtin.uri:
    url: "https://packages.synocommunity.com/?language=enu&arch={{ synology_dsm_arch }}&build={{ synology_dsm_build }}&major=7&micro=2&minor=3&nano=0&package_update_channel=stable"
    return_content: true
  register: _synocommunity_catalog
  delegate_to: localhost
  run_once: false

- name: Build package → URL map from catalog
  ansible.builtin.set_fact:
    _spk_ordered: >-
      {{
        _synocommunity_catalog.json.packages
        | selectattr('package', 'in', synology_dsm_community_packages)
        | items2dict(key_name='package', value_name='link')
      }}

- name: Ensure SPK temp directory exists on controller
  ansible.builtin.file:
    path: "{{ synology_dsm_spk_tmp }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Download SPK files to controller (NAS has no outbound internet)
  ansible.builtin.get_url:
    url: "{{ _spk_ordered[item] }}"
    dest: "{{ synology_dsm_spk_tmp }}/{{ item }}.spk"
    mode: '0644'
    force: false
  loop: "{{ synology_dsm_community_packages }}"
  when:
    - item not in _installed_pkg_names
    - item in _spk_ordered
  delegate_to: localhost

- name: Copy SPK files from controller to NAS
  become: true
  ansible.builtin.copy:
    src: "{{ synology_dsm_spk_tmp }}/{{ item }}.spk"
    dest: "{{ synology_dsm_spk_tmp }}/{{ item }}.spk"
    mode: '0644'
  loop: "{{ synology_dsm_community_packages }}"
  when:
    - item not in _installed_pkg_names
    - item in _spk_ordered

- name: Install non-byobu SPK packages first (dependency pass)
  become: true
  ansible.builtin.command:
    cmd: "/usr/syno/bin/synopkg install {{ synology_dsm_spk_tmp }}/{{ item }}.spk"
  loop: "{{ synology_dsm_community_packages }}"
  when:
    - item not in _installed_pkg_names
    - item in _spk_ordered
    - item != 'byobu'
  register: _synopkg_install
  changed_when: _synopkg_install.rc == 0

- name: Start dependency packages so byobu installer can validate them
  become: true
  ansible.builtin.command:
    cmd: "/usr/syno/bin/synopkg start {{ item }}"
  loop: "{{ synology_dsm_community_packages }}"
  when:
    - item != 'byobu'
    - item in _spk_ordered
  failed_when: false
  changed_when: false

- name: Install byobu (after deps are started)
  become: true
  ansible.builtin.command:
    cmd: "/usr/syno/bin/synopkg install {{ synology_dsm_spk_tmp }}/byobu.spk"
  when:
    - "'byobu' in synology_dsm_community_packages"
    - "'byobu' in _spk_ordered"
    - "'byobu' not in _installed_pkg_names"
  changed_when: false
  failed_when: false

- name: Verify installed packages
  become: true
  ansible.builtin.command:
    cmd: /usr/syno/bin/synopkg list --name
  register: _post_install_pkgs
  changed_when: false

- name: Report install results
  ansible.builtin.debug:
    msg: >-
      {{ item }}:
      {% if item in _post_install_pkgs.stdout %}✅ installed{% else %}❌ NOT found{% endif %}
  loop: "{{ synology_dsm_community_packages }}"

- name: Clean up SPK files from NAS
  become: true
  ansible.builtin.file:
    path: "{{ synology_dsm_spk_tmp }}/{{ item }}.spk"
    state: absent
  loop: "{{ synology_dsm_community_packages }}"
  when: item in _spk_ordered
