---
# =============================================================================
# Phase 2 — SSH-based configuration
#
# Execution order is critical for correctness and idempotency:
#
#   1.  SynoCommunity feed          — register SPK sources before any installs
#   2.  Initial fact gather         — discover DSM device, packages
#   3.  Timezone / SSH / User home  — base system config
#   4.  Community packages          — installs python312 → byobu (order enforced)
#   5.  Python facts (post-install) — discover all interpreters, select:
#                                     synology_python_best (Ansible)
#                                     synology_python_docker (Docker pip)
#                                     synology_pip_executable
#   6.  Re-gather Ansible facts     — with synology_python_best so modules
#                                     use the highest available interpreter
#   7.  pip bootstrap               — using synology_pip_executable
#   8.  ContainerManager + Docker   — pip packages installed against
#                                     synology_python_docker for SDK stability
#
# Idempotency:
#   Python facts are cached (cacheable: true). On subsequent runs, the
#   interpreter selection is pre-loaded from cache and consistent.
#   pip tasks check installed state before acting.
# =============================================================================

# ── Step 1: SynoCommunity feed ────────────────────────────────────────────────
- name: Add Syno Community package repository
  ansible.builtin.include_tasks:
    file: syno_community.yml
  tags: syno_community

# ── Step 2: Initial fact gather ───────────────────────────────────────────────
- name: Gather initial Ansible facts (minimal subset for speed)
  ansible.builtin.setup:
    gather_subset:
      - min
      - hardware
      - network

# ── Step 3: Gather DSM-specific facts ────────────────────────────────────────
- name: Gather facts about the synology
  block:
    - name: Synology Device Facts
      ansible.builtin.include_tasks:
        file: facts/device.yml
      tags: device_facts
    - name: Synology IPInfo Facts
      ansible.builtin.include_tasks:
        file: facts/ipinfo.yml
      tags: ipinfo_facts
    - name: Synology package facts
      ansible.builtin.include_tasks:
        file: facts/packages.yml
      tags: package_facts
  # End Block

# ── Step 4: Timezone ──────────────────────────────────────────────────────────
- name: Set DSM timezone
  ansible.builtin.include_tasks:
    file: timezone.yml
  when: synology_dsm_timezone | default('') | length > 0
  tags: timezone

# ── Step 5: SSH keys and critical tooling ─────────────────────────────────────
- name: SSH configuration and Install Critical Tooling
  block:
    - name: Install ssh keys from url for more secure remote management
      ansible.builtin.include_tasks:
        file: ssh_keys.yml
      tags: ssh_keys
    - name: Install Git
      ansible.builtin.include_tasks:
        file: git.yml
      tags: Git
  # End Block

# ── Step 6: User home ─────────────────────────────────────────────────────────
- name: User home configuration
  block:
    - name: Enable user home service
      ansible.builtin.include_tasks:
        file: user_home_service.yml
      tags: user_home
  # End Block

# ── Step 7: DNS ───────────────────────────────────────────────────────────────
- name: DNS configuration
  block:
    - name: Integrating cloudflare dynamic DDNS scripts into native DDNS
      when: synology_cloudflare_ddns_enable | default(false)
      ansible.builtin.include_tasks:
        file: cloudflare/ddns.yml
      tags: cloudflare_ddns_scripts
  # End Block

# ── Step 8: Community packages (SynoCommunity SPK install via SSH) ─────────────
# Package install order enforced in synology_dsm_community_packages list:
#   python312 → synocli-net → byobu (byobu requires python312 running: error 268)
# ARM64 nodes (ds218, ds418) use same list via group_vars/appserver/ override.
- name: Install SynoCommunity packages
  ansible.builtin.include_tasks:
    file: community_packages.yml
  when: synology_dsm_community_packages | default([]) | length > 0
  tags: community_packages

# ── Step 8b: Python interpreter discovery (post-package-install) ───────────────
# Runs AFTER community packages so python312/python314 are found if just installed.
# Sets three key facts consumed by pip.yml, container_manager, and downstream plays:
#   synology_python_best       — highest available, used for ansible_python_interpreter
#   synology_python_docker     — python3.12 preferred, used for Docker SDK pip installs
#   synology_pip_executable    — pip matching synology_python_docker
# Facts are cacheable — idempotent across runs.
- name: Discover Python interpreters and set pip facts
  ansible.builtin.include_tasks:
    file: facts/python.yml
  tags: python_facts

# ── Step 8c: Re-gather Ansible facts with best interpreter ────────────────────
# Switch to synology_python_best so all subsequent Ansible modules run against
# the highest available Python. This pivot is the key to efficient module execution.
- name: Re-gather Ansible facts with best available Python interpreter
  ansible.builtin.setup:
    gather_subset:
      - min
  vars:
    ansible_python_interpreter: "{{ synology_python_best | default('/bin/python3') }}"

# ── Step 9: Packages, pip, Docker ─────────────────────────────────────────────
- name: Configure native package management, python-pip, and docker
  block:
    - name: Install native Synology packages (fallback — prefer synology_dsm_api_package_list for API install)
      when: synology_package_list is defined
      ansible.builtin.include_tasks:
        file: packages.yml
      tags: synology_packages

    # pip.yml uses synology_pip_executable (set in python facts, aligns with
    # synology_python_docker). This ensures docker SDK installs go into the
    # correct interpreter and pip state is consistent across runs.
    - name: Bootstrap pip and install base packages
      ansible.builtin.include_tasks:
        file: pip.yml
      tags: Pip

    - name: Install and configure ContainerManager(Docker) and docker-compose
      when: synology_docker_enable | default(false)
      ansible.builtin.include_tasks:
        file: container_manager.yml
      tags: ContainerManager

    - name: Install shell alias commands for docker containers
      when: synology_docker_enable | default(false)
      ansible.builtin.include_tasks:
        file: cmd_aliases.yml

    - name: Install Uptime (Interoperable)
      when: synology_upptime_enable | default(false)
      ansible.builtin.include_tasks:
        file: upptime.yml
  # End Block
