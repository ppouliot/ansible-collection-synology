---
# =============================================================================
# Phase 2 — SSH-based configuration
# Order matters: Python must be upgraded before any module-based tasks run.
# =============================================================================

# ── Step 1: SynoCommunity feed ────────────────────────────────────────────────
- name: Add Syno Community package repository
  ansible.builtin.include_tasks:
    file: syno_community.yml
  tags: syno_community

# ── Step 2: Gather facts (auto_silent discovers best available Python) ────────
- name: Gather facts — auto_silent picks highest available Python interpreter
  ansible.builtin.setup:

# ── Step 3: Gather facts ──────────────────────────────────────────────────────
- name: Gather facts about the synology
  block:
    - name: Synology Device Facts
      ansible.builtin.include_tasks:
        file: facts/device.yml
      tags: device_facts
    - name: Synology IPInfo Facts
      ansible.builtin.include_tasks:
        file: facts/ipinfo.yml
      tags: ipinfo_facts
    - name: Synology package facts
      ansible.builtin.include_tasks:
        file: facts/packages.yml
      tags: package_facts
  # End Block

# ── Step 4: Timezone ─────────────────────────────────────────────────────────
- name: Set DSM timezone
  ansible.builtin.include_tasks:
    file: timezone.yml
  when: synology_dsm_timezone | default('') | length > 0
  tags: timezone

# ── Step 5: SSH keys and critical tooling ────────────────────────────────────
- name: SSH configuration and Install Critical Tooling
  block:
    - name: Install ssh keys from url for more secure remote management
      ansible.builtin.include_tasks:
        file: ssh_keys.yml
      tags: ssh_keys
    - name: Install Git
      ansible.builtin.include_tasks:
        file: git.yml
      tags: Git
  # End Block

# ── Step 6: User home ─────────────────────────────────────────────────────────
- name: User home configuration
  block:
    - name: Enable user home service
      ansible.builtin.include_tasks:
        file: user_home_service.yml
      tags: user_home
  # End Block

# ── Step 7: DNS ───────────────────────────────────────────────────────────────
- name: DNS configuration
  block:
    - name: Integrating cloudflare dynamic DDNS scripts into native DDNS
      when: synology_cloudflare_ddns_enable | default(false)
      ansible.builtin.include_tasks:
        file: cloudflare/ddns.yml
      tags: cloudflare_ddns_scripts
  # End Block

# ── Step 8: Community packages (SynoCommunity SPK install via SSH) ────────────
- name: Install SynoCommunity packages
  ansible.builtin.include_tasks:
    file: community_packages.yml
  when: synology_dsm_community_packages | default([]) | length > 0
  tags: community_packages

# ── Step 8b: Re-discover Python after community packages install ──────────────
# python314 may have just been installed. Discover the highest available
# interpreter, persist it to host_vars on the controller (so it survives
# across runs and doesn't rely on ephemeral set_fact), then re-gather facts.

- name: Re-gather facts — auto_silent re-discovers highest Python after python314 install
  ansible.builtin.setup:

# ── Step 9: Packages, pip, Docker ─────────────────────────────────────────────
- name: Configure native package management, python-pip, and docker
  block:
    - name: Install native Synology packages (fallback — prefer synology_dsm_api_package_list for API install)
      when: synology_package_list is defined
      ansible.builtin.include_tasks:
        file: packages.yml
      tags: synology_packages

    - name: Install(Upgrade) pip for python package management using Synology shipped python
      ansible.builtin.include_tasks:
        file: pip.yml
      tags: Pip

    - name: Install and configure ContainerManager(Docker) and docker-compose
      when: synology_docker_enable | default(false)
      ansible.builtin.include_tasks:
        file: container_manager.yml
      tags: ContainerManager

    - name: Install shell alias commands for docker containers
      when: synology_docker_enable | default(false)
      ansible.builtin.include_tasks:
        file: cmd_aliases.yml

    - name: Install Uptime (Interoperable)
      when: synology_upptime_enable | default(false)
      ansible.builtin.include_tasks:
        file: upptime.yml
  # End Block
