---

- name: "Create directories to house tvheadend data"
  file:
    path: "{{ container_directory_root }}/tvheadend"
    state: directory
    owner: "{{ user_puid }}"
    group: "{{ group_pgid }}"
    mode: 0775
    recurse: yes

- name: Create tvheadend container
  docker_container:
    docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
    name: tvheadend
    image: ghcr.io/linuxserver/tvheadend:latest
    pull: yes
#   network_mode: container:gluetun
#  network_mode: host
    ports:
      - "9981:9981"
      - "9982:9982"
    volumes:
      - "{{ container_directory_root }}/tvheadend:/config"
      - "{{ container_directory_root }}/tv:/recordings"
    env:
      PUID: "{{ user_puid }}"
      PGID: "{{ group_pgid }}"
      TZ: "{{ default_timezone }}"
    restart_policy: unless-stopped

