---
- name: "Prowlarr: Check if Prowlarr container directory exists"
  ansible.builtin.stat:
    path: "{{ container_directory_root }}/prowlarr"
  register: _prowlarr_config_dir
  tags:
    - prowlarr
    - prowlarr_root
- name: "Prowlarr: Create directories to house prowlarr data"
  ansible.builtin.file:
    path: "{{ container_directory_root }}/prowlarr"
    state: directory
    owner: "{{ user_puid }}"
    group: "{{ group_pgid }}"
    mode: "0775"
    recurse: true
  register: _prowlarr_config_dir
  tags:
    - prowlarr
    - prowlarr_root
  when:
    - _prowlarr_config_dir is defined
    - not _prowlarr_config_dir.stat.exists
- name: "Prowlarr: Check if Prowlarr container is running"
  community.docker.docker_container_info:
    docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
    name: prowlarr
  register: _prowlarr_state
  tags:
    - prowlarr
- name: "Prowlarr: Container installation and configuration block"
  block:
    - name: "Prowlarr: Create prowlarr container"
      community.docker.docker_container:
        docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
        name: prowlarr
        image: "{{ prowlarr_container_image }}"
        networks:
          - name: synology-docker-network
        pull: true
        network_mode: container:gluetun
        volumes:
          - "{{ container_directory_root }}/prowlarr:/config"
          - "{{ container_directory_root }}/downloads:/downloads"
        env:
          PUID: "{{ user_puid }}"
          PGID: "{{ group_pgid }}"
          TZ: "{{ default_timezone }}"
          UMASK: "022"
        restart_policy: unless-stopped
      register: _prowlarr_status
    - name: "Prowlarr: Set prowlarr_is_running fact"
      ansible.builtin.set_fact:
        prowlarr_is_running: "{{ _prowlarr_status.container.State.Running }}"
    - name: "Prowlarr: Wait for Prowlarr HTTP port to come up"
      ansible.builtin.uri:
        url: "http://{{ ansible_default_ipv4.address }}:{{ prowlarr_port }}"
        method: GET
        status_code: 200
      register: _result
      until: _result.status == 200
      retries: 30  # retry X times
      delay: 60  # pause for X sec b/w each call
    - name: "Prowlarr: Stop Prowlarr container"
      community.docker.docker_container:
        name: prowlarr
        state: stopped
    - name: "Prowlarr: Add sql script ProwlarrApplications.sql"
      ansible.builtin.template:
        src: ProwlarrApplications.sql.j2
        dest: "{{ container_directory_root }}/prowlarr/ProwlarrApplications.sql"
        owner: "{{ user_puid }}"
        group: "{{ group_pgid }}"
        mode: "0770"
    - name: "Prowlarr: Check for ProwlarrApplications"
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db "SELECT Name FROM Applications;"'
        chdir: "{{ container_directory_root }}/prowlarr"
      register: _prowlarr_applications
      changed_when: false
    - name: "Prowlarr: show _prowlarr_applications"
      ansible.builtin.debug:
        msg: "{{ _prowlarr_applications }}"
    - name: "Prowlarr: import ProwlarrApplications.sql into prowlarr.db"  # noqa empty-string-compare
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db ".read ProwlarrApplications.sql"'
        chdir: "{{ container_directory_root }}/prowlarr"
      when: _prowlarr_applications.stdout == ""
      changed_when: true
    - name: "Prowlarr: Add sql script ProwlarrDownloadClients.sql"
      ansible.builtin.template:
        src: ProwlarrDownloadClients.sql.j2
        dest: "{{ container_directory_root }}/prowlarr/ProwlarrDownloadClients.sql"
        owner: "{{ user_puid }}"
        group: "{{ group_pgid }}"
        mode: "0770"
    - name: "Prowlarr: Check for ProwlarrDownloadClients"
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db "SELECT Name FROM DownloadClients;"'
        chdir: "{{ container_directory_root }}/prowlarr"
      register: _prowlarr_download_clients
      changed_when: false
    - name: "Prowlarr: show _prowlarr_download_clients"
      ansible.builtin.debug:
        msg: "{{ _prowlarr_download_clients }}"
    - name: "Prowlarr: import ProwlarrDownloadClients.sql into prowlarr.db"  # noqa empty-string-compare
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db ".read ProwlarrDownloadClients.sql"'
        chdir: "{{ container_directory_root }}/prowlarr"
      when: _prowlarr_download_clients.stdout == ""
      changed_when: true
    - name: "Prowlarr: Add sql script ProwlarrIndexers.sql"
      ansible.builtin.template:
        src: ProwlarrIndexers.sql.j2
        dest: "{{ container_directory_root }}/prowlarr/ProwlarrIndexers.sql"
        owner: "{{ user_puid }}"
        group: "{{ group_pgid }}"
        mode: "0770"
    - name: "Prowlarr: Check for ProwlarrIndexers"
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db "SELECT Name FROM Indexers;"'
        chdir: "{{ container_directory_root }}/prowlarr"
      register: _prowlarr_indexers
      changed_when: false
    - name: "Prowlarr: show _prowlarr_indexers"
      ansible.builtin.debug:
        msg: "{{ _prowlarr_indexers }}"
    - name: "Prowlarr: import ProwlarrIndexers.sql into prowlarr.db"  # noqa empty-string-compare
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db ".read ProwlarrIndexers.sql"'
        chdir: "{{ container_directory_root }}/prowlarr"
      when: _prowlarr_indexers.stdout == ""
      changed_when: true
    - name: "Prowlarr: Check for ProwlarrNotifications"
      ansible.builtin.command:
        cmd: 'sqlite3 prowlarr.db "SELECT Name FROM Notifications;"'
        chdir: "{{ container_directory_root }}/prowlarr"
      register: _prowlarr_notifications
      changed_when: false
    - name: "Prowlarr: Start Prowlarr container"
      community.docker.docker_container:
        name: prowlarr
        state: started
 # End Block
  tags:
    - prowlarr
    - prowlarr_install
  when: not _prowlarr_state.exists
- name: "Prowlarr: Container pull and restart"
  block:
    - name: "Prowlarr: pull and restart prowlarr container"
      community.docker.docker_container:
        docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
        name: prowlarr
        image: "{{ prowlarr_container_image }}"
        networks:
          - name: synology-docker-network
        pull: true
        network_mode: container:gluetun
        volumes:
          - "{{ container_directory_root }}/prowlarr:/config"
          - "{{ container_directory_root }}/downloads:/downloads"
        env:
          PUID: "{{ user_puid }}"
          PGID: "{{ group_pgid }}"
          TZ: "{{ default_timezone }}"
          UMASK: "022"
        state: started
        restart: true
        restart_policy: unless-stopped
      register: _prowlarr_status
  when: _prowlarr_state.exists
  tags:
    - prowlarr
    - prowlarr_restart
- name: "Prowlarr: Read Prowlarr API key"
  community.general.xml:
    path: /volume1/docker/prowlarr/config.xml
    xpath: /Config/ApiKey
    content: text
  register: prowlarr_xml
- name: "Prowlarr: Set api key variable"
  ansible.builtin.debug:
    var: prowlarr_xml.matches[0].ApiKey
- name: "Prowlarr: Set Facts"
  ansible.builtin.set_fact:
    prowlarr_config_dir: "{{ _prowlarr_config_dir }}"
    prowlarr_port: "{{ prowlarr_port }}"
    prowlarr_api_key: "{{ prowlarr_xml.matches[0].ApiKey }}"
    cacheable: true
  tags:
    - prowlarr
    - prowlarr_facts
- name: "Prowlarr: Show Facts"
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop:
    - "prowlarr_config_dir: {{ _prowlarr_config_dir }}"
    - "prowlarr_port: {{ prowlarr_port }}"
    - "prowlarr_api_key {{ prowlarr_api_key }}"
  tags:
    - prowlarr
    - prowlarr_facts

- name: "Prowlarr: Re-read local facts"
  ansible.builtin.setup:
    filter: ansible_local
