---
- name: Ensure local facts directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/facts"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Gather Synology system facts
  ansible.builtin.setup:

- name: Build device facts dict
  ansible.builtin.set_fact:
    synology_device_facts:
      hostname: "{{ ansible_hostname | default('unknown') }}"
      model: "{{ ansible_product_name | default('unknown') }}"
      architecture: "{{ ansible_architecture | default('unknown') }}"
      kernel: "{{ ansible_kernel | default('unknown') }}"
      distribution: "{{ ansible_distribution | default('unknown') }}"
      distribution_version: "{{ ansible_distribution_version | default('unknown') }}"
      bios_version: "{{ ansible_bios_version | default('unknown') }}"
      memory_mb: "{{ ansible_memtotal_mb | default('unknown') }}"
      default_ipv4: "{{ ansible_default_ipv4 | default({}) }}"
      cmdline: "{{ ansible_cmdline | default({}) }}"

- name: Save device facts locally
  ansible.builtin.copy:
    content: "{{ synology_device_facts | to_nice_yaml }}"
    dest: "{{ playbook_dir }}/facts/{{ inventory_hostname }}_device.yml"
  delegate_to: localhost

- name: Display saved facts summary
  ansible.builtin.debug:
    msg: "Device facts saved → facts/{{ inventory_hostname }}_device.yml ({{ ansible_product_name | default('unknown') }}, {{ ansible_architecture | default('unknown') }}, DSM {{ ansible_distribution_version | default('unknown') }})"
