---
# =============================================================================
# HARDWARE / DSM VERSION COMPATIBILITY NOTE
# =============================================================================
# Container Manager (DSM 7.2+) replaces the legacy Docker package (DSM 6.x/7.0).
# Hardware requirements: x86_64 or compatible ARM models only.
# The following models do NOT support Container Manager or Docker:
#   - ARM-based NAS without virtualization extensions (e.g. DS218, DS220j, DS120j)
#   - Models explicitly unsupported by Synology Container Manager package list
#
# Guard: set synology_docker_enable: false in host_vars for unsupported hardware.
# All tasks in this file are gated behind: when: synology_docker_enable | default(false)
#
# Test hardware for Docker/ContainerManager tasks: confirm with Peter before running.
# =============================================================================

- name: "ContainerManager: Check if ContainerManager is already installed"
  ansible.builtin.command: "{{ synology_synopkg }} list --name"
  register: _synopkg_list_cm
  changed_when: false
  ignore_errors: true
  when: synology_docker_enable | default(false)

- name: "ContainerManager: Show installed package list"
  ansible.builtin.debug:
    var: _synopkg_list_cm.stdout
  when: synology_docker_enable | default(false)

- name: "ContainerManager: Set ContainerManager installed fact"
  ansible.builtin.set_fact:
    _container_manager_installed: "{{ 'ContainerManager' in _synopkg_list_cm.stdout }}"
  when: synology_docker_enable | default(false)

- name: "ContainerManager: Install Container Manager package if not installed"
  ansible.builtin.command: "{{ synology_synopkg }} install_from_server ContainerManager"
  when:
    - synology_docker_enable | default(false)
    - not _container_manager_installed
  become: true
  changed_when: true

- name: "ContainerManager: Get list of synology accounts"
  become: true
  ansible.builtin.command: "{{ synology_synouser }} --enum all"
  changed_when: false
  register: _synology_users_list
  when: synology_docker_enable | default(false)

# - name: add user to docker group
#  ansible.builtin.command:
#    cmd: "/usr/syno/bin/synogroup --memberadd docker {{ ansible_user }}"
#  become: true

# Enable Docker api via methods discovered here
# https://github.com/docker/machine/issues/1200
- name: "ContainerManager: Enable Docker API Access in config /var/packages/ContainerManager/etc/dockerd.json"
  ansible.builtin.template:
    dest: /volume1/@appconf/ContainerManager/dockerd.json
#   dest: /var/packages/ContainerManager/etc/dockerd.json
    src: docker/dockerd.json.j2
    backup: true
    mode: preserve
  register: dockerd_json
  notify: "Restart ContainerManager"
  when: synology_docker_enable | default(false)

- name: "ContainerManager: Flush Handlers"
  ansible.builtin.meta: flush_handlers

- name: "ContainerManager: Use pip to install python docker, docker-compose libraries"
  ansible.builtin.pip:
    name: ['docker==6.1.3', 'docker-compose', 'typing', 'zipp', 'lxml']
    executable: /bin/pip
    state: present
  when: synology_docker_enable | default(false)

- name: "ContainerManager: Check if docker-network exists"
  community.docker.docker_network_info:
    docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
    name: synology-docker-network
  tags:
    - Docker
  register: _container_manager_network_state
  when: synology_docker_enable | default(false)

- name: "ContainerManager: Create a new network for docker containers"
  community.docker.docker_network:
    docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
    name: synology-docker-network
  when:
    - synology_docker_enable | default(false)
    - not _container_manager_network_state.exists

- name: "ContainerManager: Login to ghcr.io"
  ansible.builtin.shell:
    cmd: "echo '{{ synology_ghcr_pat }}' | docker login ghcr.io -u {{ synology_ghcr_user | default('ppouliot') }} --password-stdin"
  no_log: true
  changed_when: false
  when:
    - synology_docker_enable | default(false)
    - synology_ghcr_pat | default('') | length > 0
