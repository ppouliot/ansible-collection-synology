---
- name: Create SmokePing Directories
  file:
    path: "{{ container_directory_root }}/smokeping"
    state: directory
    owner: "{{ user_puid }}"
    group: "{{ group_pgid }}"
    mode: 0775
    recurse: true
- name: Create SmokePing container
  community.docker.docker_container:
    docker_host: tcp://{{ ansible_default_ipv4.address }}:2375
    name: smokeping
    image: "{{ smokeping_container_image }}"
    pull: true
    retries: 5
    delay: 30
    network_mode: bridge
    volumes:
      - "{{ container_directory_root }}/smokeping:/config:rw"
    env:
      PUID: "{{ user_puid }}"
      PGID: "{{ group_pgid }}"
      TZ: "{{ default_timezone }}"
    ports:
      - "{{ smokeping_port }}:80"
    restart_policy: unless-stopped
