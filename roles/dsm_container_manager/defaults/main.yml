---
# =============================================================================
# dsm_container_manager defaults
# Installs and configures Docker/ContainerManager on Synology DSM 7+
#
# Hardware guard: set synology_docker_enable: false in host_vars for
# ARM models that do not support ContainerManager (DS218, DS220j, etc.)
# =============================================================================

# Master enable guard — all tasks gated behind this
synology_docker_enable: false

# Expose Docker API on TCP 2375 (required for community.docker modules)
synology_docker_api_access_enable: false

# Overlay network created for inter-container DNS resolution
synology_docker_network_name: synology-docker-network

# Docker binary path on DSM
synology_docker_cli: /usr/local/bin/docker

# ghcr.io credentials for private images (set in host_vars vault)
synology_ghcr_user: "ppouliot"
synology_ghcr_pat: ""

# Python packages installed into synology_python_best interpreter
# (python3.14 > python3.12 > /bin/python3, selected by facts/python.yml).
#
# Module breakdown — which community.docker modules need what:
#   docker_stack:      uses docker CLI subprocess ONLY — no SDK needed on NAS
#   docker_swarm:      uses AnsibleDockerClient (SDK) — needs docker package
#   docker_swarm_info: uses AnsibleDockerClient (SDK) — needs docker package
#   docker_network:    uses AnsibleDockerClient (SDK) — needs docker package
#
# docker>=7.0.0: requires_python>=3.8, compatible with python3.14.
# docker-compose: kept for direct CLI-less compose invocation compat.
# typing/zipp/lxml: dropped — stdlib in python3.14, not needed.
# requests/urllib3: explicit to ensure correct versions alongside docker SDK.
#
# Priority: Docker > byobu. Docker/ContainerManager is fleet-critical.
synology_docker_pip_packages:
  - docker>=7.0.0
  - requests>=2.26.0
  - urllib3>=1.26.0
