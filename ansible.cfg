[defaults]
# Make the local collection plugins available without full install
action_plugins = plugins/action
collections_path = ../..
vault_password_file = .vault_pass
deprecation_warnings = False
allow_world_readable_tmpfiles = True

# Interpreter discovery — auto_silent probes the remote and picks the best
# available Python. Result is cached in facts so re-reads are free.
# Pre-python314:  resolves to /bin/python3
# Post-python314: resolves to /var/packages/Python3.14/target/bin/python3.14
interpreter_python = auto_silent

# Fact caching — store gathered facts as JSON on the controller.
# Avoids re-running setup on every play; re-read with gather_facts: false.
# Cache is invalidated after fact_caching_timeout (seconds).
# Clear manually: rm -rf .facts_cache/
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 86400

[ssh_connection]
# DSM SSH closes connections aggressively — disable multiplexing
ssh_args = -o ControlMaster=no -o StrictHostKeyChecking=no -o ServerAliveInterval=5 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes
pipelining = true
