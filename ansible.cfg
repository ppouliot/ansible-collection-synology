[defaults]
# Make the local collection plugins available without full install
action_plugins = plugins/action
collections_path = ../..
vault_password_file = .vault_pass
# DSM ships Python 3.8 — suppress version warning; python3.12 installed in Phase 2
interpreter_python = /usr/bin/python3
deprecation_warnings = False
# DSM ships Python 3.8 — force interpreter, skip version enforcement
allow_world_readable_tmpfiles = True

[ssh_connection]
# DSM SSH closes connections aggressively — disable multiplexing
ssh_args = -o ControlMaster=no -o StrictHostKeyChecking=no -o ServerAliveInterval=5 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes
pipelining = true
