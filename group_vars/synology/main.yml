---
# =============================================================================
# group_vars/synology/main.yml
# Vars for all Synology hosts. Override per-host in host_vars/<host>/main.yml
# =============================================================================

# ── SSH connection ────────────────────────────────────────────────────────────
ansible_remote_tmp: "/tmp/.ansible/tmp"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=5 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o ControlMaster=no"
ansible_ssh_pipelining: true
# Let Ansible discover the highest available Python on each host at runtime.
# 'auto_silent' probes the remote and picks the best interpreter without warnings.
# Run 1 (pre-python314): finds /bin/python3
# Run 2+ (post-python314): finds /var/packages/Python3.14/target/bin/python3.14
# No host_vars mutation required — works correctly at every stage of the ladder.
ansible_python_interpreter: auto_silent

# ── Bootstrap (Phase 1 — DSM API) ────────────────────────────────────────────
synology_dsm_api_validate_certs: false
synology_dsm_api_enable_user_home: true
synology_dsm_api_enable_ssh: true
synology_dsm_api_enable_smb: true
synology_dsm_api_enable_nfs: false
synology_dsm_api_enable_afp: false
synology_dsm_api_enable_ftp: false
synology_dsm_api_enable_sftp: false
synology_dsm_api_enable_security: false
synology_dsm_api_enable_notifications: false
synology_dsm_api_enable_network: false

synology_dsm_api_group_members:
  - group: administrators
    members: "{{ [synology_dsm_api_username] | unique }}"

# SSH connection user — should match synology_dsm_api_username on fresh installs
ansible_user: "{{ synology_dsm_api_username }}"

synology_dsm_api_package_feeds:
  - name: SynoCommunity
    feed: https://packages.synocommunity.com

# Set to 'auto' to detect latest available Python from DSM, or pin e.g. 'python314'
synology_dsm_api_python_package: auto

# Community packages need type 1 install via DSM API (SynoCommunity feed required)
synology_dsm_api_community_packages:
  - "{{ synology_dsm_api_python_package }}"

synology_dsm_api_package_list:
  - __python__
  - Git
  - Tailscale

# ── Configuration (Phase 2 — SSH) ────────────────────────────────────────────
synology_docker_enable: false
synology_upptime_enable: false
synology_upgrade_packages: false
synology_refresh_packages: false

synology_package_list:
  - Git

sshkey_url: "https://github.com/ppouliot.keys"
