---
# =============================================================================
# group_vars/synology/main.yml
# Vars for all Synology hosts. Override per-host in host_vars/<host>/main.yml
# =============================================================================

# ── SSH connection ────────────────────────────────────────────────────────────
ansible_remote_tmp: "/tmp/.ansible/tmp"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=5 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o ControlMaster=no"
ansible_ssh_pipelining: true
ansible_python_interpreter: /bin/python3

# ── Bootstrap (Phase 1 — DSM API) ────────────────────────────────────────────
synology_bootstrap_validate_certs: false
synology_bootstrap_enable_user_home: true
synology_bootstrap_enable_ssh: true
synology_bootstrap_enable_smb: true
synology_bootstrap_enable_nfs: false
synology_bootstrap_enable_afp: false
synology_bootstrap_enable_ftp: false
synology_bootstrap_enable_sftp: false
synology_bootstrap_enable_security: false
synology_bootstrap_enable_notifications: false
synology_bootstrap_enable_network: false

synology_bootstrap_group_members:
  - group: administrators
    members: "{{ [synology_bootstrap_username] | unique }}"

# SSH connection user — should match synology_bootstrap_username on fresh installs
ansible_user: "{{ synology_bootstrap_username }}"

synology_bootstrap_package_feeds:
  - name: SynoCommunity
    feed: https://packages.synocommunity.com

# Set to 'auto' to detect latest available Python from DSM, or pin e.g. 'python314'
synology_bootstrap_python_package: auto

# Community packages need type 1 install via DSM API (SynoCommunity feed required)
synology_bootstrap_community_packages:
  - "{{ synology_bootstrap_python_package }}"
  - byobu

synology_bootstrap_package_list:
  - __python__
  - Git
  - byobu
  - Tailscale

# ── Configuration (Phase 2 — SSH) ────────────────────────────────────────────
synology_docker_enable: false
synology_upptime_enable: false
synology_upgrade_packages: false
synology_refresh_packages: false

synology_package_list:
  - Git

sshkey_url: "https://github.com/ppouliot.keys"
