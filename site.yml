---
# =============================================================================
# site.yml — Synology NAS provisioning
#
# Requires discrete runs in order. Each run builds the foundation for the next.
#
# RULE: Plays never write to inventory, host_vars, or group_vars.
#       State is stored in the fact cache (.facts_cache/) and re-read via setup.
#
# ── Run order ────────────────────────────────────────────────────────────────
#
#   Run 1 — DSM API bootstrap (no SSH needed):
#     ansible-playbook site.yml --tags dsm_api
#     Result: SSH enabled, SynoCommunity feed added, groups/feeds configured
#
#   Run 2 — SSH bootstrap (python3 → python314):
#     ansible-playbook site.yml --tags dsm_configuration
#     Result: python314 installed; setup re-runs, auto_silent promotes
#             to python3.14; fact cache populated with new interpreter
#
#   Run 3+ — Full configuration (python3.14):
#     ansible-playbook site.yml --tags dsm_configuration
#     Result: full Ansible capability — Docker, pip, containers
#
# ── Python interpreter ladder ────────────────────────────────────────────────
#
#   Run 1   connection=local     ansible_playbook_python (controller)
#   Run 2   SSH auto_silent      finds /bin/python3 → installs python314
#                                → setup re-runs → auto_silent finds python3.14
#                                → python3.14 path written to fact cache
#   Run 3+  SSH auto_silent      reads python3.14 from fact cache
#
# =============================================================================

# ── Phase 1: Bootstrap via DSM API (Run 1) ───────────────────────────────────
- name: Phase 1 — Bootstrap via DSM API
  hosts: synology
  connection: local
  gather_facts: false
  tags: dsm_api
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - dsm_api

# ── Phase 2: Configure via SSH (Run 2 + Run 3+) ──────────────────────────────
- name: Phase 2 — Configure via SSH
  hosts: synology
  gather_facts: true
  tags: dsm_configuration
  pre_tasks:
    - name: Wait for SSH to be ready
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ synology_dsm_api_ssh_port | default(22) }}"
        timeout: 180
        delay: 5
        connect_timeout: 10
        state: started
      delegate_to: localhost
      tags: always
  roles:
    - dsm_configuration
