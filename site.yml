---
# =============================================================================
# site.yml — Synology NAS provisioning
#
# IMPORTANT: This playbook requires discrete runs in order.
# Ansible loads inventory vars at startup — host_vars written mid-run are
# NOT visible until the next invocation. Each run builds the foundation
# for the next.
#
# ── Run order ────────────────────────────────────────────────────────────────
#
#   Run 1 — DSM API bootstrap (no SSH needed):
#     ansible-playbook site.yml --tags dsm_api
#     Result: SSH enabled, SynoCommunity feed added, feeds/groups configured
#
#   Run 2 — SSH bootstrap (python3 → python314):
#     ansible-playbook site.yml --tags dsm_configuration
#     Interpreter: /bin/python3 (group_vars default)
#     Result: python314 installed, host_vars updated with python3.14 path
#
#   Run 3+ — Full configuration (python3.14):
#     ansible-playbook site.yml --tags dsm_configuration
#     Interpreter: /var/packages/Python3.14/target/bin/python3.14 (host_vars)
#     Result: full Ansible module support, Docker, pip, etc.
#
# ── Python interpreter ladder ────────────────────────────────────────────────
#
#   Run 1   connection=local        ansible_playbook_python (controller)
#   Run 2   SSH /bin/python3        always present on DSM, minimal
#           → installs python314
#           → raw discovers path
#           → lineinfile writes to host_vars/<host>/main.yml
#   Run 3+  SSH python3.14          from host_vars, full capability
#
# =============================================================================

# ── Phase 1: Bootstrap via DSM API (Run 1) ───────────────────────────────────
- name: Phase 1 — Bootstrap via DSM API
  hosts: synology
  connection: local
  gather_facts: false
  tags: dsm_api
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - dsm_api

# ── Phase 2: Configure via SSH (Run 2 + Run 3+) ──────────────────────────────
# Run 2: uses /bin/python3 (group_vars). Installs python314, writes host_vars.
# Run 3+: uses python3.14 (host_vars). Full capability.
- name: Phase 2 — Configure via SSH
  hosts: synology
  gather_facts: false
  tags: dsm_configuration
  pre_tasks:
    - name: Wait for SSH to be ready
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ synology_dsm_api_ssh_port | default(22) }}"
        timeout: 180
        delay: 5
        connect_timeout: 10
        state: started
      delegate_to: localhost
      tags: always
  roles:
    - dsm_configuration
