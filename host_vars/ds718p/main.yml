---
# =============================================================================
# host_vars/ds718p/main.yml
# ds718p — 172.19.0.40, model TBD (discovered at runtime), lynn-ma (172.19.0.x)
# =============================================================================

# ── Connection ────────────────────────────────────────────────────────────────
ansible_host: 172.19.0.40
ansible_user: peter
ansible_password: "{{ vault_ansible_password }}"
ansible_become_password: "{{ vault_ansible_password }}"

# ── Bootstrap auth ────────────────────────────────────────────────────────────
synology_bootstrap_dsm_url: "http://172.19.0.40:5000"
synology_bootstrap_username: peter
synology_bootstrap_password: "{{ vault_ansible_password }}"
synology_bootstrap_admin_username: peter
synology_bootstrap_admin_password: "{{ vault_ansible_password }}"

# ── ds718p-specific overrides ───────────────────────────────────────────────
# DS718+ — Intel Celeron J3455, x86_64, DSM 7.x, lynn-ma (172.19.0.x)
# Temporary htpc test target while ds1821p is prepared
synology_docker_enable: true
synology_docker_api_access_enable: true
synology_upptime_enable: false

# ── Docker / Container Manager ───────────────────────────────────────────────
container_directory_root: /volume1/docker
synology_ghcr_user: ppouliot
synology_ghcr_pat: "{{ vault_synology_ghcr_pat }}"

# ── Cloudflare (htpc role vars) ───────────────────────────────────────────────
cloudflare_host_name: ds718p

# ── Facts ─────────────────────────────────────────────────────────────────────
synology_facts_dir: "{{ playbook_dir }}/facts"
