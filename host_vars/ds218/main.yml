---
# =============================================================================
# host_vars/ds218/main.yml
# DS218 — 172.19.0.43, aarch64, DSM 7.3.2, lynn-ma (172.19.0.x)
# No container_manager/upptime/virtualization (not supported on DS218)
# =============================================================================

# ── Connection ────────────────────────────────────────────────────────────────
ansible_host: 172.19.0.43
ansible_user: peter
ansible_password: "{{ vault_ansible_password }}"
ansible_become_password: "{{ vault_ansible_password }}"

# ── Bootstrap auth ────────────────────────────────────────────────────────────
synology_bootstrap_dsm_url: "http://172.19.0.43:5000"
synology_bootstrap_username: peter
synology_bootstrap_password: "{{ vault_ansible_password }}"
synology_bootstrap_admin_username: peter
synology_bootstrap_admin_password: "{{ vault_ansible_password }}"

# ── DS218-specific overrides ──────────────────────────────────────────────────
synology_docker_enable: false
synology_upptime_enable: false

# ── Facts ─────────────────────────────────────────────────────────────────────
synology_facts_dir: "{{ playbook_dir }}/facts"
