---
# =============================================================================
# host_vars/ds218p02/main.yml
# ds218p02 — 172.19.0.42, model TBD (discovered at runtime), lynn-ma (172.19.0.x)
# =============================================================================

# ── Connection ────────────────────────────────────────────────────────────────
ansible_host: 172.19.0.42
ansible_user: beavis
ansible_password: "{{ vault_ansible_password }}"
ansible_become_password: "{{ vault_ansible_password }}"

# ── Bootstrap auth ────────────────────────────────────────────────────────────
synology_dsm_api_dsm_url: "http://172.19.0.42:5000"
synology_dsm_api_username: beavis
synology_dsm_api_password: "{{ vault_ansible_password }}"

# ── ds218p02-specific overrides ─────────────────────────────────────────────────
synology_docker_enable: true
synology_upptime_enable: false

# ── Facts ─────────────────────────────────────────────────────────────────────
synology_facts_dir: "{{ playbook_dir }}/facts"
swarm_role: worker
